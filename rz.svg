<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" width="680" height="480"><style>:root{--sk-line:#374151;--sk-dim:#b45309;--sk-calc:#b45309;--sk-empty:#6b7280;--sk-ref:#2563eb;--sk-hatch:#9ca3af;--sk-bg:#f9fafb} svg{background:#f9fafb}/* Rozteč děr a osazení */
.rz-face { fill: var(--sk-hatch, rgba(127,127,127,.12)); fill-opacity: .35; stroke: var(--sk-line); stroke-width: 1.5; }
.rz-inner { fill: var(--sk-bg); stroke: var(--sk-line); stroke-width: 1.5; }
.rz-pcd { fill: none; stroke: var(--sk-ref); stroke-width: 1; stroke-dasharray: 10 3 2 3; }
.rz-hole { fill: var(--sk-bg); stroke: var(--sk-line); stroke-width: 1.2; }
.rz-bar { fill: var(--sk-empty); }
.rz-cal { stroke: var(--sk-ref); stroke-width: 2; }
.rz-tape { stroke: var(--sk-dim); stroke-width: 2.5; }
text { font-size: 11px; }
.sk-calc, .sk-empty, .sk-legend { paint-order: stroke; stroke: var(--sk-bg); stroke-width: 3px; }
.sk-calc { fill: var(--sk-calc); font-weight: 700; }
.sk-empty { fill: var(--sk-empty); }
.sk-legend { fill: var(--sk-line); }
.rz-vykres { margin-top: 10px; }
.rz-vykres summary { cursor: pointer; color: var(--accent); }
</style><circle class="rz-face" cx="170" cy="120" r="112"></circle><circle class="rz-inner" cx="170" cy="120" r="44"></circle><circle class="rz-pcd" cx="170" cy="120" r="82"></circle><circle class="rz-hole" cx="88" cy="120" r="10"></circle><circle class="rz-hole" cx="252" cy="120" r="10"></circle><circle class="rz-bar" cx="252" cy="120" r="8"></circle><line class="rz-cal" x1="78" y1="120" x2="78" y2="86"></line><line class="rz-cal" x1="262" y1="120" x2="262" y2="86"></line><line class="rz-cal" x1="78" y1="90" x2="262" y2="90"></line><text class="sk-legend" x="170" y="84" text-anchor="middle">posuvka přes díry</text><text class="sk-calc" x="170" y="124" text-anchor="middle">Ø 670 rozteč</text><line class="rz-tape" x1="260" y1="138" x2="282" y2="138"></line><line class="rz-tape" x1="214" y1="138" x2="244" y2="138"></line><text class="sk-legend" x="286" y="142" text-anchor="start">ven</text><text class="sk-legend" x="210" y="142" text-anchor="end">dovnitř</text><text class="sk-calc" x="170" y="26" text-anchor="middle">Ø 750 vnější</text><text class="sk-calc" x="170" y="146" text-anchor="middle">Ø 560 vnitřní</text></svg>